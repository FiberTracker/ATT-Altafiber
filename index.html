<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Analysis</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f3f4f6; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:40px 44px; box-shadow:0 4px 16px rgba(0,0,0,0.06); text-align:center; max-width:380px; }
  h1 { font-size:1.05rem; color:#1a1a1a; margin-bottom:6px; }
  p { font-size:0.75rem; color:#6b7280; margin-bottom:20px; }
  input { width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px; font-size:0.9rem; margin-bottom:12px; text-align:center; letter-spacing:2px; }
  button { width:100%; padding:10px; background:#1a1a1a; color:#fff; border:none; border-radius:8px; font-size:0.85rem; font-weight:600; cursor:pointer; }
  button:hover { background:#374151; }
  .err { color:#dc2626; font-size:0.72rem; margin-top:10px; display:none; }
</style>
</head>
<body>
<div class="card">
  <h1>Footprint Overlap Analysis</h1>
  <p>Enter access code to continue</p>
  <input type="password" id="pw" placeholder="&bull;&bull;&bull;&bull;" onkeydown="if(event.key==='Enter')go()">
  <button onclick="go()">Access</button>
  <div class="err" id="err">Incorrect code</div>
</div>
<script>
function simpleHash(s) {
  var h = 0x5f2a1e3d;
  for (var i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
  return (h >>> 0).toString(16).padStart(8, '0') + h.toString(16).slice(-8);
}
function go() {
  var v = document.getElementById('pw').value;
  if (simpleHash(v) === '645e2cbf645e2cbf') {
    sessionStorage.setItem('auth', '1');
    window.location.href = 'dashboard.html';
  } else {
    document.getElementById('err').style.display = 'block';
  }
}
</script>
</body>
</html>
